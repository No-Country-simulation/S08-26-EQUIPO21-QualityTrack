name: "🐛 Reporte de Bug (QA)"
description: Plantilla avanzada de QA con severidad, prioridad y datos de prueba.
title: "[BUG]: "
labels: ["bug"]
type: Bug
projects: ["No-Country-simulation/497"]

body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar este problema. Por favor completa los campos para facilitar la reproducción del fallo.

  - type: textarea
    id: description
    attributes:
      label: Descripción / Resumen
      description: Explicación concisa de qué está fallando y cuándo ocurre.
      placeholder: El sistema no muestra mensaje de error al enviar formulario vacío...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Entorno de Prueba
      description: Especifica el entorno donde ocurrió la incidencia.
      value: |
        - **Dispositivo / SO:** (Ej: PC Windows 11 / iPhone 14)
        - **Navegador y Versión:** (Ej: Chrome v125 / Safari)
        - **Tipo de Pantalla:** (Desktop / Mobile / Tablet)
    validations:
      required: true

  - type: textarea
    id: preconditions_and_data
    attributes:
      label: Precondiciones y Datos de Prueba
      description: Estado previo requerido e inputs usados (usuarios, contraseñas, URLs o variables).
      placeholder: |
        Precondiciones:
        1. Usuario con rol Admin autenticado.

        Datos de prueba:
        - Email: qa_test@example.com
        - Input vacío en campo Contraseña.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Pasos para Reproducir
      description: Paso a paso exacto para llegar al error.
      placeholder: |
        1. Ir a la sección...
        2. Hacer clic en...
        3. Enviar el formulario...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado Esperado
      description: ¿Qué debería pasar según el criterio de aceptación?
      placeholder: Debería mostrarse un tooltip rojo indicando "Campo obligatorio".
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado Obtenido
      description: ¿Qué pasó realmente? (Comportamiento erróneo).
      placeholder: La página recarga sin avisos y se pierden los datos ingresados.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severidad (Impacto Técnico)
      description: Grado de afectación técnica en el sistema.
      options:
        - "Bloqueante (Blocker) - El sistema/flujo queda inoperativo o pantalla en blanco"
        - "Crítica (Critical) - Falla función principal sin workaround"
        - "Mayor (Major) - Falla función importante pero hay camino alternativo"
        - "Menor (Minor) - Error visual, estético o texto mal escrito"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Prioridad (Urgencia de Negocio)
      description: Necesidad de resolución para el sprint.
      options:
        - "Alta - Debe resolverse en el Sprint actual obligatoriamente"
        - "Media - Resolver en el Sprint actual si hay capacidad"
        - "Baja - No urgente, puede planificarse a futuro"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidencias y Contexto Adicional
      description: Arrastra capturas, videos, logs de consola o trazas de error de red.
      placeholder: Pega aquí capturas de pantalla, logs o comentarios adicionales.
    validations:
      required: false