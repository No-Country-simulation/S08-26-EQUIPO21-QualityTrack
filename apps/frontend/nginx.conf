server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los assets del build de Vite (JS/CSS con hash) van bajo /assets/ --
    # acá el fallback a index.html NO aplica: si un asset no existe (chunk
    # roto, referencia vieja en un index.html cacheado), tiene que dar 404
    # real, no una respuesta 200 con el HTML de la SPA que enmascararía el
    # error.
    location /assets/ {
        try_files $uri =404;
    }

    # react-router usa rutas del lado del cliente -- sin este fallback,
    # refrescar una ruta interna (ej. /work-orders/123) devuelve 404,
    # porque nginx busca ese path como archivo real y no existe.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
