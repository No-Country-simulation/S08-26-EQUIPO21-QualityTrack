# Reemplaza el /etc/nginx/nginx.conf de la imagen entera (no solo el
# server block de conf.d/default.conf) para poder fijar worker_processes.
# El default de la imagen (`worker_processes auto;`) detecta la cantidad
# de CPUs del host compartido de Railway, no el límite real asignado al
# contenedor -- en el primer deploy real arrancó 71 worker processes para
# servir HTML/JS estático. Un valor fijo y chico alcanza de sobra.
user  nginx;
worker_processes  2;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Los assets del build de Vite (JS/CSS con hash) van bajo /assets/ --
        # acá el fallback a index.html NO aplica: si un asset no existe (chunk
        # roto, referencia vieja en un index.html cacheado), tiene que dar 404
        # real, no una respuesta 200 con el HTML de la SPA que enmascararía el
        # error.
        location /assets/ {
            try_files $uri =404;
        }

        # react-router usa rutas del lado del cliente -- sin este fallback,
        # refrescar una ruta interna (ej. /work-orders/123) devuelve 404,
        # porque nginx busca ese path como archivo real y no existe.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
