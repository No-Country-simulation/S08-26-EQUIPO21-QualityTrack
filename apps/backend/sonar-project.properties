sonar.projectKey=qualitytrack-backend
sonar.projectName=qualitytrack-backend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.e2e-spec.ts
# Cliente de Prisma generado (ver schema.prisma) -- no es código propio.
sonar.exclusions=src/generated/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# S4123 ("'await' should only be used with promises") en los e2e: Supertest
# encadena `request(...).post(...).expect(...)` devolviendo `Test` (vía
# `Request` de superagent), que implementa then/catch/finally -- es
# "thenable" y `await` funciona correcto en runtime -- pero no extiende
# `Promise` nominalmente, así que Sonar lo marca como falso positivo en
# cada `await request(...)`. Es el patrón oficial de Supertest en toda su
# documentación; reescribirlo degradaría el estilo idiomático del e2e sin
# corregir nada real.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4123
sonar.issue.ignore.multicriteria.e1.resourceKey=test/**/*.e2e-spec.ts
